name: CI/CD Pipeline

on:
  push:
    branches: [ main, master, feat/adding-CI-* ] # Added your current branch pattern
  pull_request:
    branches: [ main, master ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      # --- BACKEND SECTION ---
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore Backend Dependencies
        run: |
          dotnet restore backend/UserService.API/UserService.API.csproj
          dotnet restore backend/UserService.Tests/UserService.Tests.csproj
          dotnet restore backend/UserService.IntegrationTests/UserService.IntegrationTests.csproj

      - name: Build Backend (Release)
        run: dotnet build backend/UserService.API/UserService.API.csproj --configuration Release

      - name: Run Unit Tests
        # We point to the project file and let dotnet find the Release DLLs itself
        run: dotnet test backend/UserService.Tests/UserService.Tests.csproj --configuration Release --verbosity normal

      - name: Run Integration Tests
        run: dotnet test backend/UserService.IntegrationTests/UserService.IntegrationTests.csproj --configuration Release --verbosity normal
        env:
          Jwt__Key: "ci-test-key-must-be-at-least-32-chars-long!!"
          Jwt__Issuer: "auth-system"
          Jwt__Audience: "auth-system"

      # --- FRONTEND SECTION ---
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: './frontend/package-lock.json'

      - name: Install Frontend Deps
        run: |
          cd frontend
          npm ci 

      - name: Build Frontend
        run: |
          cd frontend
          npm run build

      # --- INFRASTRUCTURE SECTION ---
      - name: Verify Docker Environment
        run: docker compose config

      - name: Full Docker Build Verification
        run: docker compose build