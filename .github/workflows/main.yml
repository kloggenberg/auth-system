name: CI/CD Pipeline

on:
  push:
    branches: [ main, master, feat/adding-CI-* ]
  pull_request:
    branches: [ main, master ]

jobs:
  backend-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore & Build
        run: |
          dotnet restore backend/UserService.API/UserService.API.csproj
          dotnet build backend/UserService.API/UserService.API.csproj --configuration Release

  backend-test:
    needs: backend-build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Run Unit Tests
        run: dotnet test backend/UserService.Tests/UserService.Tests.csproj --configuration Release --verbosity normal

      - name: Run Integration Tests
        run: dotnet test backend/UserService.IntegrationTests/UserService.IntegrationTests.csproj --configuration Release --verbosity normal
        env:
          Jwt__Key: "ci-test-key-must-be-at-least-32-chars-long!!"
          Jwt__Issuer: "auth-system"
          Jwt__Audience: "auth-system"

  frontend-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: './frontend/package-lock.json'

      - name: Install & Build
        run: |
          cd frontend
          npm ci 
          npm run build

  docker-verify:
    needs: [backend-test, frontend-build]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Verify Docker Environment
        run: |
          docker compose config
          docker compose build