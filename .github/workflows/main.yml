name: CI/CD Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      # --- BACKEND SECTION ---
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore Backend Dependencies
        run: dotnet restore ./backend/UserService.sln

      - name: Build Backend
        run: dotnet build ./backend/UserService.sln --configuration Release --no-restore

      - name: Run Unit & Integration Tests
        run: dotnet test ./backend/UserService.sln --configuration Release --no-build --verbosity normal
        env:
          # Providing dummy secrets so tests don't fail on missing config
          Jwt__Key: "ci-test-key-must-be-at-least-32-chars-long!!"
          Jwt__Issuer: "auth-system"
          Jwt__Audience: "auth-system"

      # --- FRONTEND SECTION ---
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: './frontend/package-lock.json'

      - name: Install Frontend Deps
        run: |
          cd frontend
          npm ci # Use 'npm ci' for faster, more reliable CI builds

      - name: Build Frontend
        run: |
          cd frontend
          npm run build

      # --- INFRASTRUCTURE SECTION ---
      - name: Verify Docker Environment
        # This checks if the Dockerfiles and the Gateway config (nginx.conf) are valid
        run: docker compose config

      - name: Full Docker Build Verification
        run: docker compose build