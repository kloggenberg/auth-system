version: '3.8'

services:
  gateway:
    image: nginx:alpine
    container_name: api_gateway
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - api
      - frontend

  db:
    image: postgres:15
    container_name: postgres_db
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: authdb
    volumes:
      - postgres_data:/var/lib/postgresql/data

  api:
    build:
      context: ./backend/UserService.API
    container_name: user_service_api
    restart: always
    # Ports removed! Only accessible via Gateway
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ASPNETCORE_URLS=http://+:8080
      - ConnectionStrings__DefaultConnection=Host=db;Port=5432;Database=authdb;Username=postgres;Password=postgres
      - Jwt__Key=super-secret-key-super-secret-key
      - Jwt__Issuer=auth-system
      - Jwt__Audience=auth-system
    depends_on:
      - db

  frontend:
    build:
      context: ./frontend
    container_name: react_frontend
    restart: always
    # Ports removed! Only accessible via Gateway
    depends_on:
      - api

volumes:
  postgres_data: